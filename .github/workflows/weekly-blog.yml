name: Génération automatique d'article de blog

on:
  schedule:
    # Un article le lundi et le jeudi à 7 h UTC
    - cron: "0 7 * * 1,4"

  # Permet un lancement manuel depuis GitHub Actions
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: karnett-blog
  cancel-in-progress: false

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier si un article a déjà été publié aujourd'hui
        id: check
        shell: bash
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          if git log \
            --since="${TODAY} 00:00:00" \
            --until="${TODAY} 23:59:59" \
            --grep="Blog automatique : nouvel article publié sans relecture" \
            --format="%H" | grep -q .; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Un article a déjà été publié aujourd'hui."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Aucun article publié aujourd'hui."
          fi

      - name: Installer Python
        if: steps.check.outputs.already == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer le nouvel article
        if: steps.check.outputs.already == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_article.py

      - name: Publier directement en ligne
        if: steps.check.outputs.already == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "Rien à publier"
            exit 0
          fi

          git commit -m "Blog automatique : nouvel article publié sans relecture"
          git push
