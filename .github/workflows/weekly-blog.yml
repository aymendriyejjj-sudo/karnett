name: Génération automatique d'article de blog

on:
  schedule:
    # Plusieurs occasions de rattrapage, hors début d'heure (GitHub peut retarder ou sauter un créneau).
    - cron: "17 7,12,16 * * 1,4"
    - cron: "17 8 * * 2,5"

  # Une modification de ce workflow sur main lance aussi le contrôle de rattrapage.
  push:
    branches: [main]
    paths: ['.github/workflows/weekly-blog.yml']

  # Permet un lancement manuel depuis GitHub Actions
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: karnett-blog
  cancel-in-progress: false

jobs:
  generate-article:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Déterminer le créneau et éviter les doublons
        id: check
        shell: bash
        run: |
          SLOT_START=$(python - <<'PY'
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Paris'))
          day = now.weekday()
          if day in (0, 1):
              start = now.date() - timedelta(days=day)
          elif day in (3, 4):
              start = now.date() - timedelta(days=day - 3)
          else:
              print('')
              raise SystemExit
          print(datetime.combine(start, time.min, ZoneInfo('Europe/Paris')).astimezone(timezone.utc).isoformat())
          PY
          )
          if [ -z "$SLOT_START" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Hors créneau de publication."
            exit 0
          fi
          if git log \
            --since="$SLOT_START" \
            --grep="Blog automatique : nouvel article publié sans relecture" \
            --format="%H" | grep -q .; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "L'article de ce créneau a déjà été publié."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Publication manquante pour ce créneau : génération."
          fi

      - name: Installer Python
        if: steps.check.outputs.already == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer le nouvel article
        if: steps.check.outputs.already == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_article.py

      - name: Publier directement en ligne
        if: steps.check.outputs.already == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "Rien à publier"
            exit 0
          fi

          git commit -m "Blog automatique : nouvel article publié sans relecture"
          git push
